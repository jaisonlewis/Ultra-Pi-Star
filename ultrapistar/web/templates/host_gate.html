{% extends "base.html" %}
{% block title %}Host access{% endblock %}
{% block body_class %}phone{% endblock %}
{% block content %}
<section class="card gate">
  <h1>Host only</h1>
  <p>This console needs the host key shown on the server console at startup.</p>
  <form method="get" action="/host" class="row">
    <input name="key" type="password" placeholder="Host key" required>
    <button class="primary" type="submit">Enter</button>
  </form>
</section>
{% endblock %}
